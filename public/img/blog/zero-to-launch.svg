<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-label="An ascending line from a first commit to a launched product">
  <defs>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#2a2f38"/>
    </pattern>
  </defs>
  <rect width="1200" height="600" fill="#0e1013"/>
  <rect width="1200" height="600" fill="url(#dots)"/>
  <rect x="40" y="40" width="1120" height="520" fill="none" stroke="#2a2f38" stroke-width="2"/>
  <g stroke="#2a2f38" stroke-width="2">
    <line x1="150" y1="480" x2="1050" y2="480"/>
