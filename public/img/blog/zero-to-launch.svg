  <circle cx="1000" cy="160" r="14" fill="none" stroke="#edeae3" stroke-width="4"/>
  <text x="190" y="425" font-family="monospace" font-size="22" fill="#8b9299">mvp</text>
  <text x="930" y="130" font-family="monospace" font-size="22" fill="#edeae3">launch</text>
</svg>
