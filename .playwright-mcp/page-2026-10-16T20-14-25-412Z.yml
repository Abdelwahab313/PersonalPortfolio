    - region "The gaps between people cost more than the code" [ref=e389]:
      - generic [ref=e390]:
        - heading "The gaps between people cost more than the code" [level=2] [ref=e391]
        - generic [ref=e392]:
          - paragraph [ref=e393]: "Most software delays come from handoffs: a brief rewritten for the next person, context lost between roles, a decision waiting on the next meeting. With AI and modern tooling now covering much of the work that used to need extra hands, one experienced engineer can take a well-scoped project from the first conversation to production without those gaps."
          - paragraph [ref=e394]: "I work with AI-enabled software engineering workflows: AI-assisted development and code review alongside automated tests, infrastructure as code and CI/CD, which take care of the repetitive work. My time goes on the decisions. When a project genuinely needs more people, I will say so at the start and help you plan for it."
