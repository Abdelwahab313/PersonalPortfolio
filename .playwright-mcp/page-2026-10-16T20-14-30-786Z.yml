          - paragraph [ref=e229]:
            - strong [ref=e230]: "Key insight:"
            - text: Temporal leads in developer ergonomics and scalability; Camunda excels at BPMN and process modeling for business-facing workflows.
          - heading "Frequently Asked Questions" [level=2] [ref=e231]
          - paragraph [ref=e232]:
            - strong [ref=e233]: "Q: What’s the difference between choreography and orchestration in sagas?"
            - text: "A: Orchestration centralizes workflow control in a coordinator (e.g., Temporal, Camunda), ensuring strong consistency and explicit compensation. Choreography is event-based with no central controller, leading to looser coupling but harder compensation logic and observability."
          - paragraph [ref=e234]:
            - strong [ref=e235]: "Q: How do I ensure compensation steps are always run after a failure?"
            - text: "A: Compensation steps must be explicitly modeled in the workflow definition. Engines like Temporal and Camunda guarantee compensation execution on failure, even after restarts, by persisting workflow state and retrying until success or manual intervention."
          - paragraph [ref=e236]:
            - strong [ref=e237]: "Q: Can saga orchestrators handle millions of workflows in production?"
            - text: "A: Yes. Temporal (v1.22.3) and Camunda 8 (v8.3.0) are proven at 10k+ concurrent workflows/sec, with large enterprises running millions of workflows per day. Proper sharding, worker scaling, and persistent storage tuning are required."
          - heading "Key Takeaways" [level=2] [ref=e238]
          - list [ref=e239]:
            - listitem [ref=e240]: Rely on workflow engines like Temporal or Camunda instead of homegrown orchestration to achieve reliability, scalability, and observability.
            - listitem [ref=e241]: Always model explicit, idempotent compensation logic for each saga step to ensure safe failure recovery.
            - listitem [ref=e242]: Integrate Prometheus, OpenTelemetry, and alerting for real-time saga monitoring and root cause analysis.
            - listitem [ref=e243]:
              - text: Use versioning patterns (e.g., Temporal’s
              - code [ref=e244]: GetVersion
              - text: ", Camunda’s process definitions) to support safe upgrades and evolving business logic."
            - listitem [ref=e245]: Configure backoff, max retries, and async steps to prevent retry storms and deadlocks in large-scale distributed workflows.
            - listitem [ref=e246]: Test compensation and failure scenarios as rigorously as happy paths to avoid production surprises.
