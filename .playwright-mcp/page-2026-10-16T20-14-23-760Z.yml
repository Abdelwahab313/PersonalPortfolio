      - generic [ref=e55]:
        - generic [ref=e56]:
          - heading "A database pinned at 100%" [level=2] [ref=e57]
          - paragraph [ref=e58]: Aurora MySQL sat at 100% CPU and stayed there. Requests that were fine before started queuing, and the whole product felt it, not just the feature behind the load.
          - paragraph [ref=e59]: "One endpoint was behind it: a status broadcast that pushed state out to a lot of clients. Each time it ran, it called the database 1,013 times."
        - generic [ref=e60]:
          - heading "A broadcast doing too much work" [level=2] [ref=e61]
          - paragraph [ref=e62]: The broadcast looked harmless. It read the current state and fanned it out. But each call read more than it should have, and there were over a thousand of them.
          - paragraph [ref=e63]: All I had was a database pinned at full CPU and one caller running a thousand queries a broadcast. I did not yet know why it mattered.
        - generic [ref=e64]:
          - heading "The obvious fixes were all wrong" [level=2] [ref=e65]
          - paragraph [ref=e66]: "The instinct was to tune the query: add an index, raise the instance size, cache harder. All three were guesses."
          - paragraph [ref=e67]: An index does nothing if the query is not using one, and a bigger instance buys time by hiding the real cause. I also could not take the broadcast down. Clients needed fresh status. The goal was to keep the system up for everyone, not to protect the database by breaking a feature.
        - generic [ref=e68]:
          - heading "Read the plan first" [level=2] [ref=e69]
          - paragraph [ref=e70]: I ran EXPLAIN on the broadcast query instead of guessing. The plan examined 7.33 million rows per call.
          - paragraph [ref=e71]: That number changed the problem. This was not a missing index. The query scanned and joined a large set every time it ran, more than a thousand times per broadcast.
        - generic [ref=e72]:
          - heading "Drop the join, throttle the caller" [level=2] [ref=e73]
          - paragraph [ref=e74]: Two changes, in order of impact. I dropped the join that forced the scan and let the broadcast read only the rows it needed. Then I throttled the caller so it could not fan out 1,013 times in a burst.
          - paragraph [ref=e75]: "Throttling had a visible cost: some clients got a slightly staler broadcast. That was the trade. Freshness for a subset, in exchange for a database that stayed reachable for everyone."
        - generic [ref=e76]:
          - heading "What changed" [level=2] [ref=e77]
          - paragraph [ref=e78]: Calls dropped from 1,013 to about 100 per broadcast, and CPU came back to baseline. The feature stayed up. No instance resize, no new cache layer, no guessing.
          - paragraph [ref=e79]: The data behind the dropped join was not worth a full scan a thousand times over.
        - generic [ref=e80]:
          - heading "Lesson" [level=2] [ref=e81]
          - paragraph [ref=e82]: When a query looks suspicious, run EXPLAIN first. An index is one possible answer. A plan that scans 7.33 million rows per call is a different problem, and you only see it by reading the plan.
